name: Temporary Prettier diagnostic
on:
  push:
    branches: [security/124-trusted-push-http-boundary]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Show exact Prettier changes
        run: |
          ./node_modules/.bin/prettier --write src/delivery/composition/trusted-push-http-handler.ts
          git diff -- src/delivery/composition/trusted-push-http-handler.ts
