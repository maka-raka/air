name: Release

# Publishes a verified package tarball for projects that install AIR.
# Nothing is published to the npm registry.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run quality:check

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          [[ "$TAG" == "$version" ]] || { echo "Tag $TAG != $version" >&2; exit 1; }

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          npm run build
          file=$(npm pack --silent)
          sha256sum "$file" > SHA256SUMS
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.pack.outputs.file }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" "$FILE" SHA256SUMS --verify-tag \
            --title "AIR $TAG" \
            --notes "Install: npm install --save-dev https://github.com/$REPO/releases/download/$TAG/$FILE
          Verify: gh attestation verify $FILE --repo $REPO"
