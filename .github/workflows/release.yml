name: Release

# Publishes a verified package tarball for projects that install AIR.
# Nothing is published to the npm registry.
#
# Two jobs: `build` runs dependencies and tests with no write or signing
# permission; `publish` only checks the tarball's hash, attests it and
# creates the release. A compromised dev dependency can then neither request
# an OIDC token nor change what gets attested after the hash was taken.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run quality:check

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          [[ "$TAG" == "$version" ]] || { echo "Tag $TAG != $version" >&2; exit 1; }

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          npm run build
          file=$(npm pack --silent --ignore-scripts)
          sha256sum "$file" > SHA256SUMS
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ steps.pack.outputs.file }}
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Check the tarball hash
        env:
          FILE: ${{ needs.build.outputs.file }}
        run: |
          set -euo pipefail
          [[ "$FILE" =~ ^air-delivery-core-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]] || { echo "Unexpected file: $FILE" >&2; exit 1; }
          [[ "$(wc -l < SHA256SUMS)" -eq 1 ]] || { echo "SHA256SUMS must name one file" >&2; exit 1; }
          sha256sum --check --strict SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.file }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ needs.build.outputs.file }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" "$FILE" SHA256SUMS --verify-tag --repo "$REPO" \
            --title "AIR $TAG" \
            --notes "Install: npm install --save-dev https://github.com/$REPO/releases/download/$TAG/$FILE
          Verify: gh attestation verify $FILE --repo $REPO"
