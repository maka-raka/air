name: LikeC4 architecture

on:
  pull_request:
    paths:
      - 'docs/architecture/likec4/**'
      - '.github/workflows/likec4-architecture.yml'
  push:
    branches: [main]
    paths:
      - 'docs/architecture/likec4/**'
      - '.github/workflows/likec4-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: likec4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build diagrams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install LikeC4 CLI (pinned)
        run: npm install --global likec4@1.60.0

      - name: Validate LikeC4
        working-directory: docs/architecture/likec4
        run: likec4 validate

      - name: Build static website
        working-directory: docs/architecture/likec4
        run: likec4 build -o "$GITHUB_WORKSPACE/dist" --base /air/ --use-hash-history

      - name: Upload build for private review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: air-likec4-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact only when explicitly enabled
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AIR_PAGES_PUBLICATION_ENABLED == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/

  deploy:
    name: Publish GitHub Pages (explicit opt-in only)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AIR_PAGES_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
