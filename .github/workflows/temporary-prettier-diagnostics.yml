name: Temporary Prettier diagnostics
on:
  push:
    branches:
      - security/124-github-app-token-issuer
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Print exact Prettier changes
        run: |
          npx prettier --write src/delivery/adapters/github/github-app-installation-token-issuer.ts src/delivery/adapters/github/github-app-installation-token-issuer.test.ts
          git diff -- src/delivery/adapters/github/github-app-installation-token-issuer.ts src/delivery/adapters/github/github-app-installation-token-issuer.test.ts
