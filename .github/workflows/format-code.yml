name: Format code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/github-issues-http-adapter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run format:write
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tools eslint.config.mjs
          git commit -m "style: format TypeScript and tooling with Prettier"
          git push origin HEAD:feat/github-issues-http-adapter
