name: Docker images

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - src/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .github/workflows/docker.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Build and smoke-test images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compose file is valid
        run: |
          touch .env.air .env.air.poller .env.air.agent
          docker compose config --quiet
          docker compose --profile agent config --quiet

      - name: Build poller image
        run: docker build --pull -t air:ci .

      - name: Build agent image
        run: docker build --pull -t air-agent:ci docker/agent

      - name: Poller refuses to start without configuration
        run: |
          set +e
          out=$(docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true air:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "Set AIR_" <<<"$out"

      - name: Poller image runs as non-root and ships the CLIs
        run: |
          test "$(docker run --rm --entrypoint id air:ci -u)" != 0
          docker run --rm --entrypoint node air:ci \
            /opt/air/dist/src/delivery/composition/agent-cli.js keygen >/dev/null
          test -z "$(docker run --rm --entrypoint sh air:ci -c 'find /opt/air/dist -name "*.test.js"')"

      - name: Launcher refuses to run with AIR credentials
        run: |
          set +e
          out=$(docker run --rm -e AIR_OPERATOR_SIGNING_KEY=k --entrypoint node air:ci \
            /opt/air/dist/src/delivery/composition/launcher.js 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "holds no AIR credentials" <<<"$out"

      - name: Console refuses to run with AIR credentials
        run: |
          set +e
          out=$(docker run --rm -e AIR_GITHUB_TOKEN=t --entrypoint node air:ci \
            /opt/air/dist/src/delivery/composition/console.js 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          grep -q "air-ui only reads" <<<"$out"

      - name: Agent entrypoint validates its input
        run: |
          set +e
          usage=$(docker run --rm air-agent:ci 2>&1); usage_code=$?
          missing=$(docker run --rm air-agent:ci 1 2>&1); missing_code=$?
          bad=$(docker run --rm -e AIR_REPOSITORY='x/y;rm' -e AIR_AGENT_LOGIN=a \
            -e AIR_AGENT_TOKEN=t -e AIR_AGENT_SIGNING_KEY=k -e ANTHROPIC_API_KEY=k \
            air-agent:ci 1 2>&1); bad_code=$?
          set -e
          printf '%s\n' "$usage" "$missing" "$bad"
          test "$usage_code" -ne 0
          grep -q "usage: air-agent" <<<"$usage"
          test "$missing_code" -ne 0
          grep -q "set AIR_REPOSITORY" <<<"$missing"
          test "$bad_code" -ne 0
          grep -q "must be <owner>/<repo>" <<<"$bad"
          set +e
          mode=$(docker run --rm -e AIR_REPOSITORY=x/y -e AIR_AGENT_LOGIN=a \
            -e AIR_AGENT_TOKEN=t -e AIR_AGENT_SIGNING_KEY=k -e ANTHROPIC_API_KEY=k \
            -e AIR_AGENT_MODE=unattended air-agent:ci 1 2>&1); mode_code=$?
          set -e
          echo "$mode"
          test "$mode_code" -ne 0
          grep -q "AIR_AGENT_MODE must be interactive or headless" <<<"$mode"

      - name: Agent image tools and managed settings
        run: |
          test "$(docker run --rm --entrypoint id air-agent:ci -u)" != 0
          docker run --rm --entrypoint claude air-agent:ci --version
          docker run --rm --entrypoint sh air-agent:ci -c 'git --version && gh --version && tmux -V'
          docker run --rm --entrypoint jq air-agent:ci -e \
            '.permissions.deny | index("Bash(gh issue view:*)") != null' \
            /etc/claude-code/managed-settings.json \
            >/dev/null
          docker run --rm --entrypoint jq air-agent:ci -e \
            '.allowManagedHooksOnly and .allowManagedPermissionRulesOnly and .allowManagedMcpServersOnly and .allowedMcpServers == []' \
            /etc/claude-code/managed-settings.json

      - name: Agent Stop hook sends the agent back only while the gate would refuse
        run: |
          docker run --rm --entrypoint jq air-agent:ci -e \
            '.hooks.Stop[0].hooks[0].command == "/usr/local/bin/air-stop-hook"' \
            /etc/claude-code/managed-settings.json
          docker run --rm --entrypoint bash air-agent:ci -c '
            set -euo pipefail
            mkdir -p /tmp/bin
            printf "%s\n" "#!/bin/sh" "echo \"would reject: build\"; exit \${FAKE_GATE:-2}" > /tmp/bin/npx
            chmod +x /tmp/bin/npx
            export PATH=/tmp/bin:$PATH AIR_ISSUE=42 AIR_STOP_HOOK_MAX=1
            if echo "{}" | air-stop-hook 2>/tmp/err; then exit 1; fi
            grep -q "the gate would refuse" /tmp/err
            echo "{}" | air-stop-hook
            echo "{}" | AIR_ISSUE=43 FAKE_GATE=0 air-stop-hook
            echo "{}" | AIR_ISSUE=44 FAKE_GATE=1 air-stop-hook
          '

      - name: Headless agent run ends with a gate or a block, never working
        run: |
          docker run --rm --entrypoint jq air-agent:ci -e \
            '(.permissions.allow | index("Bash(npx air:*)") != null) and (.permissions.deny | index("Edit(.github/**)") != null)' \
            /etc/claude-code/managed-settings.json
          docker run --rm --entrypoint bash air-agent:ci -c '
            set -euo pipefail
            mkdir -p /tmp/bin
            cat > /tmp/bin/npx <<"STUB"
          #!/bin/sh
          echo "$*" >> /tmp/calls
          case "$*" in
            *--check*) echo "would ${FAKE_GATE:-reject}: build"; [ "${FAKE_GATE:-reject}" = pass ] || exit 2 ;;
          esac
          STUB
            chmod +x /tmp/bin/npx
            export PATH=/tmp/bin:$PATH
            FAKE_GATE=pass air-finish-run 42
            grep -qx -- "--no air gate 42" /tmp/calls
            air-finish-run 43
            grep -q -- "^--no air block 43 --question-file" /tmp/calls
          '

      - name: Agent refuses a branch that changes its configuration
        run: |
          docker run --rm --entrypoint bash air-agent:ci -c '
            set -euo pipefail
            cd /tmp && git init -q -b main r && cd r
            git config user.email ci@example.com && git config user.name ci
            echo "{\"packages\":{\"node_modules/@air/delivery-core\":{\"version\":\"1.0.0\",\"resolved\":\"https://a/x.tgz\",\"integrity\":\"sha512-a\"}}}" > package-lock.json
            git add -A && git commit -qm base
            git switch -q -c work && echo x > app.js && git add -A && git commit -qm work
            air-check-branch main work
            git switch -q -c hooks work && mkdir .claude && echo "{}" > .claude/settings.json
            git add -A && git commit -qm hooks
            if air-check-branch main hooks; then exit 1; fi
            git switch -q -c pin work && sed -i "s|https://a/x.tgz|https://b/x.tgz|" package-lock.json
            git commit -qam pin
            if air-check-branch main pin; then exit 1; fi
          '
